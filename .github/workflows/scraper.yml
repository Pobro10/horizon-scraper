name: Horizon Scraper

on:
  schedule:
    # Neokrugli minuti — okrugli termini su najzagušeniji na GitHubu (kašnjenja 2-4h)
    - cron: '23 4 * * *'    # 04:23 UTC = 06:23 CEST
    - cron: '47 8 * * *'    # 08:47 UTC = 10:47 CEST  ← jedini run koji šalje email
    - cron: '41 13 * * *'   # 13:41 UTC = 15:41 CEST
    - cron: '19 17 * * *'   # 17:19 UTC = 19:19 CEST
  workflow_dispatch:         # ručno pokretanje (uvijek šalje email)

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Podešavanje Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalacija zavisnosti
        run: pip install -r requirements.txt

      - name: Pokretanje scrapera
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Email ide iz SVAKOG runa: sent.json garantuje da isti oglas ne
          # ide dvaput, a run bez novih vlasnika ionako ne šalje ništa.
          # (Ranija veza za tačan cron termin je pukla kad je GitHub počeo
          # preskakati termin 08:47 zbog zagušenja.)
          SEND_EMAIL: "true"
        run: python horizon_scraper.py

      - name: Sačuvaj audit log i memoriju u repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit_log.csv || true
          git add sent.json || true
          git add seen.json || true
          git add phones.json || true
          git diff --cached --quiet || git commit -m "audit log + sent $(date -u +%Y-%m-%dT%H:%M)"
          # Repo se mogao promijeniti između checkouta i pusha: rebase pa push,
          # do 3 pokušaja. Poslije neuspjelog rebasea OBAVEZNO abort, inače bi
          # push sigurno pao. Ako ni treći pokušaj ne prođe, upiši upozorenje
          # ali ne obaraj workflow (audit log nije kritičan za sljedeći run).
          # --autostash: skripta ostavlja i netrackovane/izmijenjene fajlove
          # (npr. leads_today.json dok je bio trackovan) — bez autostasha
          # rebase odbija rad i push tiho propada (47 dana, 17.8-3.10).
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Push memorije (sent/seen/audit) nije uspio poslije 3 pokušaja"
          exit 1

      - name: Sačuvaj leads kao artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_id }}
          path: leads_today.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Sačuvaj log kao artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log-${{ github.run_id }}
          path: scraper.log
          retention-days: 14
