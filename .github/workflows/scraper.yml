name: Horizon Scraper

on:
  schedule:
    - cron: '0 6 * * *'     # 06:00 UTC = 08:00 CET
    - cron: '30 10 * * *'   # 10:30 UTC = 12:30 CET  ← jedini run koji šalje email
    - cron: '0 14 * * *'    # 14:00 UTC = 16:00 CET
    - cron: '0 18 * * *'    # 18:00 UTC = 20:00 CET
  workflow_dispatch:         # ručno pokretanje (uvijek šalje email)

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Podešavanje Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalacija zavisnosti
        run: pip install -r requirements.txt

      - name: Pokretanje scrapera
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Email šalje samo run u 10:30 UTC ili ručni trigger
          SEND_EMAIL: ${{ github.event.schedule == '30 10 * * *' || github.event_name == 'workflow_dispatch' }}
        run: python horizon_scraper.py

      - name: Sačuvaj leads kao artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_id }}
          path: leads_today.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Sačuvaj log kao artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log-${{ github.run_id }}
          path: scraper.log
          retention-days: 14
