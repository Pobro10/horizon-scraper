name: Horizon Scraper

on:
  schedule:
    # Svaki sat (neokrugli minut: okrugli termini su najzagušeniji). Skupljanje
    # je jeftino (~1 min, keš), a mejl ide samo u prozorima 07:30 i 15:30 po
    # lokalnom vremenu (MAIL_PROZORI u skripti). GitHub redovno preskače ili
    # kasni 2-3 h sa pojedinim terminima (04:23 UTC nije izvršen ni 6. ni
    # 7.10.), pa satni raspored garantuje da bar jedan run upadne u prozor.
    - cron: '17 * * * *'
  workflow_dispatch:         # ručno pokretanje: šalje email odmah, bez čekanja prozora

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Podešavanje Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalacija zavisnosti
        run: pip install -r requirements.txt

      - name: Pokretanje scrapera
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # schedule: "prozor" = vlasnici se nakupljaju, mejl ide u prozorima
          # 07:30 i 15:30 (lokalno). Ručno pokretanje šalje odmah ("true").
          # sent.json garantuje da isti oglas ne ide dvaput.
          SEND_EMAIL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'prozor' }}
        run: python horizon_scraper.py

      - name: Sačuvaj audit log i memoriju u repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit_log.csv || true
          git add sent.json || true
          git add seen.json || true
          git add phones.json || true
          git diff --cached --quiet || git commit -m "audit log + sent $(date -u +%Y-%m-%dT%H:%M)"
          # Repo se mogao promijeniti između checkouta i pusha: rebase pa push,
          # do 3 pokušaja. Poslije neuspjelog rebasea OBAVEZNO abort, inače bi
          # push sigurno pao. Ako ni treći pokušaj ne prođe, upiši upozorenje
          # ali ne obaraj workflow (audit log nije kritičan za sljedeći run).
          # --autostash: skripta ostavlja i netrackovane/izmijenjene fajlove
          # (npr. leads_today.json dok je bio trackovan) — bez autostasha
          # rebase odbija rad i push tiho propada (47 dana, 17.8-3.10).
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Push memorije (sent/seen/audit) nije uspio poslije 3 pokušaja"
          exit 1

      - name: Sačuvaj leads kao artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_id }}
          path: leads_today.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Sačuvaj log kao artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log-${{ github.run_id }}
          path: scraper.log
          retention-days: 14
